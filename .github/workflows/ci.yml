name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.lock }
      - run: pip install -r requirements.lock
      - name: Tests (no model key needed)
        env: { MOCK_LLM: "true" }
        run: python -m pytest tests -q -p no:warnings
      - name: Dataset and retrieval checks
        env: { MOCK_LLM: "true" }
        run: python -c "from eval import dpdp_qa; from eval.common import corpus; assert dpdp_qa.validate(dpdp_qa.load(), corpus()[0]) == []"

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx vite build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile.prod backend
      - run: docker build -f frontend/Dockerfile.prod frontend
