# Pings the API every 10 minutes so Render's free plan never puts it to sleep (it sleeps after 15 idle
# minutes and then takes about a minute to wake). One always-on service uses ~744 of the 750 free hours a month.
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 --retry 2 https://dpdp-compass-api.onrender.com/health
