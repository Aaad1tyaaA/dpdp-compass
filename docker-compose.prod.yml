# Production stack: API + web. Copy .env.production.example to .env.production and fill it in, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  backend:
    build: { context: ./backend, dockerfile: Dockerfile.prod }
    env_file: .env.production
    environment:
      ENV: production
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://compass.example.org}
    volumes:
      - ./data/legal:/data/legal:ro        # the Gazette PDF of the Act
      - compass_storage:/app/storage       # saved audits (SQLite) and uploads
      - compass_cache:/app/.cache
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 3g, cpus: "2" } } }
    expose: ["8000"]

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile.prod }
    depends_on: { backend: { condition: service_healthy } }
    ports: ["${WEB_PORT:-8080}:8080"]      # put a TLS-terminating proxy or load balancer in front
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  compass_storage:
  compass_cache:
